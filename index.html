<!DOCTYPE html>
<!--
  Invoice Processing Hub
  ----------------------
  A browser-only tool. Drop in one or many invoice PDFs, click Process,
  and it pulls out the six fields your team reconciles, shows them in a table,
  and lets you download an Excel file.

  How it works (plain language):
    - PDF.js (a free tool from Mozilla) reads the text inside each PDF.
    - We locate the six values by their labels and column positions.
    - SheetJS (another free tool) builds the Excel file, all in your browser.

  Nothing is uploaded anywhere. Everything happens on your own computer.
  You need to be online the first time so it can load those two free tools.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Processing Hub</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; max-width: 1050px; margin: 32px auto;
         padding: 0 20px; color: #1a1f2e; background: #f6f7fb; }
  h1 { margin-bottom: 2px; }
  .subtitle { color: #667; margin-top: 0; }
  #dropzone { border: 3px dashed #b7c0d8; border-radius: 12px; padding: 40px 20px;
              text-align: center; color: #55607a; background: #fff; cursor: pointer;
              transition: all .15s ease; }
  #dropzone.dragover { border-color: #4a6cf7; background: #eef2ff; color: #2b3a67; }
  #dropzone strong { color: #2b3a67; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button { background: #4a6cf7; color: #fff; border: none; padding: 11px 18px; border-radius: 8px;
           font-size: 15px; cursor: pointer; }
  button:hover { background: #3a56d4; }
  button:disabled { background: #b7c0d8; cursor: not-allowed; }
  button.secondary { background: #10893e; }
  button.secondary:hover { background: #0c6f32; }
  #fileList { margin-top: 14px; font-size: 14px; color: #55607a; }
  #fileList div { padding: 2px 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; background: #fff;
          border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { border-bottom: 1px solid #e6e9f2; padding: 9px 12px; text-align: left; }
  th { background: #eef2ff; color: #22314f; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.error td { background: #fff3f3; color: #b3261e; }
  .status { margin-top: 14px; color: #55607a; min-height: 20px; }
  .hint { font-size: 12.5px; color: #8792a8; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Invoice Processing Hub</h1>
  <p class="subtitle">Drop in invoice PDFs, extract the reconciliation fields, and export to Excel.</p>

  <div id="dropzone">
    <p><strong>Drag invoice PDFs here</strong> (one or many)</p>
    <p>or click to choose files</p>
  </div>
  <input type="file" id="fileInput" accept="application/pdf" multiple style="display:none" />

  <div id="fileList"></div>

  <div class="row">
    <button id="processBtn" disabled>Process Invoices</button>
    <button id="exportBtn" class="secondary" disabled>Download Excel</button>
    <button id="clearBtn" style="background:#7a8699;">Clear</button>
  </div>

  <div id="status" class="status"></div>

  <div id="results"></div>

  <!-- Free tools loaded from trusted public libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileListEl = document.getElementById("fileList");
    const processBtn = document.getElementById("processBtn");
    const exportBtn = document.getElementById("exportBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    let files = [];       // the PDFs the user dropped in
    let rows = [];        // the extracted results

    // ---------- File selection ----------
    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => addFiles(e.target.files));
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault(); dropzone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });

    function addFiles(fileObjs) {
      for (const f of fileObjs) {
        if (f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")) files.push(f);
      }
      renderFileList();
    }

    function renderFileList() {
      if (!files.length) { fileListEl.innerHTML = ""; processBtn.disabled = true; return; }
      fileListEl.innerHTML = "<strong>" + files.length + " file(s) ready:</strong>" +
        files.map(f => "<div>• " + f.name + "</div>").join("");
      processBtn.disabled = false;
    }

    clearBtn.addEventListener("click", () => {
      files = []; rows = []; fileInput.value = "";
      renderFileList(); resultsEl.innerHTML = ""; statusEl.textContent = "";
      exportBtn.disabled = true;
    });

    // ---------- Group text items into visual lines (top-to-bottom) ----------
    // This is more reliable than reading the raw text stream, because some
    // values (like the PO Number) wrap onto the next line inside their column.
    function groupLines(items) {
      const its = items.map(it => ({ x: it.transform[4], y: it.transform[5], s: it.str }))
                       .filter(it => it.s !== undefined);
      its.sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const lines = [];
      let cur = null;
      for (const it of its) {
        if (!cur || Math.abs(it.y - cur.y) > 3) { cur = { y: it.y, items: [it] }; lines.push(cur); }
        else cur.items.push(it);
      }
      return lines.map(l => ({
        y: l.y,
        text: l.items.sort((a, b) => a.x - b.x).map(i => i.s).join(" ").replace(/\s+/g, " ").trim()
      }));
    }

    // ---------- Extract the six fields from one PDF ----------
    async function extractInvoice(arrayBuffer) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      // Gather visual lines from every page.
      let allLines = [];
      const perPageLines = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        const lines = groupLines(tc.items);
        perPageLines.push(lines);
        allLines = allLines.concat(lines);
      }
      const fullText = allLines.map(l => l.text).join("\n");

      // Invoice Number
      const invMatch = fullText.match(/Invoice Number:\s*([0-9]+)/);
      const invoiceNumber = invMatch ? invMatch[1] : "";

      // PO Number (Nike's "Cust Prod PO #" column, e.g. "SOXRFL 06182026").
      // The value wraps: the header row shows "<Order#> <OrderDate> <POprefix> <ShipDoc>"
      // and the PO's second half sits on the line directly below.
      let poNumber = "";
      outer:
      for (const lines of perPageLines) {
        for (let i = 0; i < lines.length; i++) {
          const m = lines[i].text.match(/^(\d{9,})\s+(\d{2}\/\d{2}\/\d{4})\s+(.+)$/);
          if (m) {
            const rest = m[3].trim().split(/\s+/); // [POprefix, ShipDoc]
            const prefix = rest[0] || "";
            let suffix = "";
            if (i + 1 < lines.length) {
              const nm = lines[i + 1].text.match(/^(\d{6,10})$/);
              if (nm) suffix = nm[1];
            }
            poNumber = (suffix ? prefix + " " + suffix : prefix).trim();
            break outer;
          }
        }
      }

      // Totals row: find the labelled summary line, take the numbers on the next line.
      // Works no matter which page it lands on, and ignores "Page Subtotal" lines.
      let gross = null, disc = null, net = null, freight = null, tax = null, totalDue = null;
      for (let i = 0; i < allLines.length; i++) {
        const t = allLines[i].text;
        if (t.includes("Net Amount") && t.includes("Total Due USD")) {
          const valLine = (allLines[i + 1] || {}).text || "";
          // Amounts usually look like "56.19", but Nike sometimes prints
          // "13.9" (one decimal) or just "0" — accept all of those.
          const nums = valLine.match(/[\d,]+(?:\.\d+)?-?/g);
          if (nums && nums.length >= 6) {
            const clean = (n) => parseFloat(n.replace(/,/g, "").replace(/-/g, ""));
            // order: Gross, Total Disc, Net, Freight, Tax, Total Due USD
            // (Total Disc prints as "44.10-"; we record it as a positive number.)
            gross = clean(nums[0]); disc = clean(nums[1]);
            net = clean(nums[2]); freight = clean(nums[3]); tax = clean(nums[4]); totalDue = clean(nums[5]);
          }
          break;
        }
      }

      const ok = invoiceNumber && poNumber && net != null && totalDue != null;
      return {
        poNumber, invoiceNumber, gross, disc, net, freight, tax, totalDue,
        error: ok ? "" : "Could not read all fields — please check this PDF."
      };
    }

    // ---------- Process button ----------
    processBtn.addEventListener("click", async () => {
      processBtn.disabled = true; exportBtn.disabled = true;
      rows = [];
      for (let i = 0; i < files.length; i++) {
        statusEl.textContent = "Processing " + (i + 1) + " of " + files.length + ": " + files[i].name;
        try {
          const buf = await files[i].arrayBuffer();
          const data = await extractInvoice(buf);
          rows.push({ file: files[i].name, ...data });
        } catch (err) {
          rows.push({ file: files[i].name, poNumber: "", invoiceNumber: "", net: null,
                      freight: null, tax: null, totalDue: null, error: "Couldn't open this PDF." });
        }
      }
      renderResults();
      const good = rows.filter(r => !r.error).length;
      statusEl.textContent = "Done. Extracted " + good + " of " + rows.length + " invoice(s).";
      processBtn.disabled = false;
      exportBtn.disabled = good === 0;
    });

    // ---------- Show the results table ----------
    function money(v) { return v == null ? "" : "$" + v.toFixed(2); }

    function renderResults() {
      if (!rows.length) { resultsEl.innerHTML = ""; return; }
      let html = "<table><thead><tr>" +
        "<th>PO Number</th><th>Invoice Number</th><th>Gross Amount</th><th>Total Disc</th>" +
        "<th>Net Amount</th><th>Freight Amount</th><th>Tax Amount</th><th>Total Due USD</th></tr></thead><tbody>";
      for (const r of rows) {
        html += "<tr class='" + (r.error ? "error" : "") + "'>" +
          "<td>" + (r.poNumber || "—") + "</td>" +
          "<td>" + (r.invoiceNumber || "—") + "</td>" +
          "<td class='num'>" + money(r.gross) + "</td>" +
          "<td class='num'>" + money(r.disc) + "</td>" +
          "<td class='num'>" + money(r.net) + "</td>" +
          "<td class='num'>" + money(r.freight) + "</td>" +
          "<td class='num'>" + money(r.tax) + "</td>" +
          "<td class='num'>" + money(r.totalDue) + "</td></tr>";
        if (r.error) {
          html += "<tr class='error'><td colspan='8' style='font-size:12.5px'>⚠ " +
                  r.file + ": " + r.error + "</td></tr>";
        }
      }
      html += "</tbody></table>";
      resultsEl.innerHTML = html;
    }

    // ---------- Excel export ----------
    exportBtn.addEventListener("click", () => {
      const header = ["PO Number", "Invoice Number", "Gross Amount", "Total Disc", "Net Amount", "Freight Amount", "Tax Amount", "Total Due USD"];
      const data = [header];
      for (const r of rows) {
        if (r.error) continue; // only export rows we read successfully
        data.push([r.poNumber, r.invoiceNumber, r.gross, r.disc, r.net, r.freight, r.tax, r.totalDue]);
      }
      const ws = XLSX.utils.aoa_to_sheet(data);
      // Keep PO and Invoice as text so long numbers aren't altered.
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Invoices");
      XLSX.writeFile(wb, "invoices.xlsx");
    });
  </script>
</body>
</html>
